name: NAV catch-up (temporary)

# Временный workflow первичного наполнения норвежской части базы.
#
# Зачем он вообще нужен: в ленте NAV нельзя прыгнуть на нужную дату —
# If-Modified-Since отдаёт 500/504 на любой глубине, поэтому дойти до недавних
# записей можно только пройдя ленту с её начала (14.06.2023). Один прогон
# ограничен временем функции, а Hobby-план Vercel разрешает cron не чаще раза
# в сутки — при таком темпе догон занял бы годы. Actions дают триггер раз в
# десять минут и этим ограничение обходят.
#
# Записи старше NAV_CATCHUP_WINDOW_DAYS (60) импортёр пропускает без запроса
# деталей, так что три года истории пролистываются, а запросы тратятся только
# на нужное окно.
#
# УДАЛИТЬ, когда курсор дойдёт до текущей даты: дальше хватает суточного cron
# Vercel (vercel.json, /api/import-nav в 04:15 UTC).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Два прогона одновременно двигали бы один курсор — второй перезаписал бы
# checkpoint первого. Очередь с отменой лишнего запуска это исключает.
concurrency:
  group: nav-catchup
  cancel-in-progress: false

jobs:
  catch-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run one NAV import pass
        env:
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
        run: |
          response=$(curl --silent --show-error --max-time 330 \
            --write-out '\nHTTP %{http_code} in %{time_total}s\n' \
            --header "Authorization: Bearer $IMPORT_SECRET" \
            "https://balticworkers.eu/api/import-nav")
          echo "$response"
          # Тело ответа — сводка прогона: imported / records / pages / cursor.
          # Секрет уходит только в заголовке и в логи не попадает.
          echo "$response" | grep -q '"source":"nav"' || {
            echo "::error::NAV import did not return a run summary"
            exit 1
          }
