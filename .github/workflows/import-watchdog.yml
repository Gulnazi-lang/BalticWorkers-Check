name: Import watchdog

# Независимый dead man's switch: проверяет отметку УЖЕ завершённого импорта,
# но никогда не вызывает /api/import сам. Поэтому сбой Vercel Cron не
# маскируется вторым импортом. Endpoint публичный и отдаёт только факт
# свежести, секрет GitHub Actions не требуется.

on:
  schedule:
    # После часового окна выполнения Vercel Cron (05:15 UTC).
    - cron: "30 6 * * *"
  workflow_dispatch: {}

jobs:
  check-import:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the last successful import
        run: |
          curl --fail --silent --show-error \
            --max-time 20 \
            "https://balticworkers.eu/api/import-health"
